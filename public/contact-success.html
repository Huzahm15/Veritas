<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Received — Veritas Consultation</title>
  </head>

  <body style="margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #fbfaf6; color: #2d2a24;">
    <main
      style="
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      "
    >
      <section
        style="
          max-width: 620px;
          width: 100%;
          text-align: center;
          background: #ffffff;
          border: 1px solid rgba(180, 140, 60, 0.28);
          border-radius: 28px;
          padding: 56px 36px;
          box-shadow: 0 30px 80px -55px rgba(180, 140, 60, 0.65);
        "
      >
        <div
          style="
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, #c9a34e, #8f6a1f);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
          "
        >
          ✓
        </div>

        <p
          style="
            margin: 0 0 14px;
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #9a7a2f;
            font-family: Arial, sans-serif;
          "
        >
          Message Received
        </p>

        <h1 style="margin: 0; font-size: 42px; line-height: 1.1; font-weight: 500;">
          Thank you for reaching out.
        </h1>

        <p
          style="
            margin: 18px auto 0;
            max-width: 460px;
            font-size: 16px;
            line-height: 1.7;
            color: #746f63;
            font-family: Arial, sans-serif;
          "
        >
          Your message has been received. A member of the Veritas team will reply within one
          business day.
        </p>

        <a
          href="/contact"
          style="
            display: inline-block;
            margin-top: 34px;
            padding: 14px 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, #c9a34e, #8f6a1f);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
            font-weight: 600;
          "
        >
          Back to contact page
        </a>
      </section>
    </main>
  </body>
</html>
