<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Veritas Consultation</title>
  </head>

  <body>
    <main>
      <h1>Contact Veritas Consultation</h1>
      <p>Tell us what you're building, improving, or planning.</p>

      <form
        name="contact"
        method="POST"
        data-netlify="true"
        netlify-honeypot="bot-field"
        action="/contact-success.html"
      >
        <input type="hidden" name="form-name" value="contact" />

        <p style="display: none;">
          <label>
            Do not fill this out:
            <input name="bot-field" />
          </label>
        </p>

        <p>
          <label>
            Your name
            <input type="text" name="name" required />
          </label>
        </p>

        <p>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
        </p>

        <p>
          <label>
            Service of interest
            <select name="service">
              <option value="">Select a service…</option>
              <option value="Wikipedia Page Creation & Editing">
                Wikipedia Page Creation & Editing
              </option>
              <option value="Ebook Services">Ebook Services</option>
              <option value="AI Bot Services">AI Bot Services</option>
              <option value="Full-stack Web Development">
                Full-stack Web Development
              </option>
              <option value="Not sure yet — advise me">
                Not sure yet — advise me
              </option>
            </select>
          </label>
        </p>

        <p>
          <label>
            Your message
            <textarea
              name="message"
              rows="6"
              required
              placeholder="A few sentences about your goals, your audience, and what you'd like to build or improve."
            ></textarea>
          </label>
        </p>

        <p>
          <button type="submit">Send Message</button>
        </p>
      </form>
    </main>
  </body>
</html>
